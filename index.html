<!doctype html>
<html lang="es" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API-CADIF1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
    };
  </script>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white transition-colors duration-300">
  <header class="sticky top-0 z-50 bg-transparent dark:bg-slate-950/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800/80 transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center">
      <div class="flex items-center gap-3 mx-10">
        <span
          class="text-lg font-bold tracking-tight bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-700 dark:from-white dark:via-slate-200 dark:to-slate-400 bg-clip-text text-transparent">
          API-CADIF1
        </span>
      </div>
      <div class="flex items-center gap-3 mx-5">
        <button id="darkMode" aria-label="Cambiar a modo oscuro" class="p-2 rounded-lg bg-slate-200 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:text-indigo-600 transition dark:hidden">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
        </button>
        <button id="lightMode" aria-label="Cambiar a modo claro" class="p-2 rounded-lg bg-slate-200 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:text-amber-400 transition hidden dark:block">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
            </path>
          </svg>
        </button>
      </div>
    </div>
  </header>
  <div class="flex-1 max-w-7xl p-4 sm:p-7 w-full mx-auto flex flex-col md:flex-row gap-6 items-start">
    <aside class="w-full md:w-72 bg-white/70 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-5 backdrop-blur-sm shadow-xl shrink-0 sticky top-20 rounded-xl transition-colors duration-300">
      <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-200 dark:border-slate-800/60">
        <h2 class="text-xs font-bold tracking-wider uppercase text-slate-700 dark:text-white">
          Áreas de Estudio
        </h2>
        <span id="areas-disponibles"
          class="text-[10px] bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 px-2 py-0.5 rounded-full font-semibold border border-indigo-200 dark:border-indigo-500/20"></span>
      </div>
      <nav id="areas-estudio" class="space-y-1"></nav>
    </aside>
    <main id="principal" class="flex-1 w-full bg-white/70 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 md:p-8 backdrop-blur-sm shadow-xl dark:shadow-2xl flex flex-col justify-between transition-colors duration-300">
      <div id="catalogo" class="">
        <div class="mb-6">
          <h2 class="text-3xl font-bold text-slate-900 dark:text-white">
            Catálogo de Cursos
          </h2>
          <p class="text-base text-slate-600 dark:text-slate-400 mt-3">
            Explora las opciones de áreas de estudio y selecciona un tema para
            comenzar.
          </p>
        </div>
        <div id="resultados-cursos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>
    </main>
  </div>
  <script src="./js/darkmode.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
